name: Unittest Workflow

on:
  push:
    branches-ignore:
      - master
  pull_request:
  workflow_call:
    inputs:
      run_packaging_checks:
        description: Run packaging and Docker smoke checks in reusable mode
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  workflow-contracts:
    name: Workflow contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Controller web dependencies
        working-directory: controller-web
        run: npm ci --no-fund
      - name: Validate CI and release matrices
        run: node scripts/tests/validate_ci_release_workflows.test.mjs

  rust-tests:
    name: Rust tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        uses: arduino/setup-protoc@v3
        with:
          version: '33.5'
          repo-token: ${{ github.token }}
      - name: Verify protobuf compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: protoc --version
      - name: Run Cargo tests
        run: |
          cargo test -p videnoa-core --lib --tests
          cargo test -p videnoa-app --lib --tests

  web-build-check:
    name: Web build check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-fund
      - name: Build web assets
        working-directory: web
        run: npm run build

  controller-rust:
    name: Controller Rust quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.83
        with:
          components: rustfmt, clippy
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Controller Clippy
        run: cargo clippy -p videnoa-controller --all-targets --all-features -- -D warnings
      - name: Run Controller tests
        run: cargo test -p videnoa-controller --all-targets

  controller-fault-load:
    name: Controller fault and load suites
    needs: [controller-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.83
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run crash and outage suite
        run: cargo test -p videnoa-controller --test task20 -- --nocapture
      - name: Run load, concurrency, filesystem, resource, and security suites
        run: |
          cargo test -p videnoa-controller \
            --test task21 \
            --test task21_concurrency \
            --test task21_filesystem \
            --test task21_resources \
            --test task21_security \
            -- --nocapture

  controller-web:
    name: Controller web quality and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: controller-web
        run: npm ci --no-fund
      - name: Lint
        working-directory: controller-web
        run: npm run lint
      - name: Run unit tests
        working-directory: controller-web
        run: npm test -- --run
      - name: Build
        working-directory: controller-web
        run: npm run build
      - name: Install Chromium
        working-directory: controller-web
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: controller-web
        run: npm run test:e2e

  controller-package-linux-smoke:
    name: Controller archive smoke (Linux)
    if: ${{ github.event_name != 'workflow_call' || inputs.run_packaging_checks }}
    needs: [controller-rust, controller-web]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust 1.83
        uses: dtolnay/rust-toolchain@1.83
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate archive root files
        run: bash scripts/tests/controller_archive_root_files_test.sh
      - name: Run Linux archive contracts
        run: bash scripts/tests/package_controller_test.sh
      - name: Build and verify Linux Controller archive
        run: bash scripts/package_controller.sh --target x86_64-unknown-linux-gnu --output-dir "$RUNNER_TEMP/controller-linux"

  controller-package-windows-smoke:
    name: Controller archive smoke (Windows)
    if: ${{ github.event_name != 'workflow_call' || inputs.run_packaging_checks }}
    needs: [controller-rust, controller-web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust 1.83
        uses: dtolnay/rust-toolchain@1.83
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Package Windows Controller archive
        shell: pwsh
        run: |
          pwsh -File scripts/package_controller.ps1 -Target x86_64-pc-windows-msvc -OutputDir "$env:RUNNER_TEMP\controller-windows"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          $archive = Join-Path $env:RUNNER_TEMP "controller-windows\videnoa-controller-v${version}-windows-x86_64.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Missing Controller archive: $archive"
          }
          pwsh -File scripts/package_controller.ps1 -VerifyArchive $archive

  controller-docker-smoke:
    name: Controller image and content smoke
    if: ${{ github.event_name != 'workflow_call' || inputs.run_packaging_checks }}
    needs: [controller-rust, controller-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Controller image
        run: docker build -f Dockerfile.controller -t videnoa-controller:ci .
      - name: Verify Controller image and content
        run: bash scripts/check_controller_container.sh videnoa-controller:ci --all

  package-linux64-smoke:
    name: Package smoke (Linux)
    if: ${{ github.event_name != 'workflow_call' || inputs.run_packaging_checks }}
    needs: [rust-tests, web-build-check]
    runs-on: ubuntu-22.04
    env:
      ARCHIVE_NAME: videnoa-linux64-smoke.7z
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            protobuf-compiler \
            p7zip-full \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - name: Run legacy Linux archive contracts
        run: bash scripts/tests/package_dist_archive_test.sh
      - name: Build package bundle
        run: |
          bash scripts/package_dist.sh --platform linux64 --release-tag misc --output-dir "$RUNNER_TEMP/dist-linux64" --source-dir "$GITHUB_WORKSPACE" --force
      - name: Verify Linux runtime compatibility
        run: bash scripts/check_linux_package_compat.sh "$RUNNER_TEMP/dist-linux64/videnoa"
      - name: Reclaim build cache for archive headroom
        run: |
          rm -rf "$HOME/.cargo/registry" "$HOME/.cargo/git" "$HOME/.npm"
          sudo apt-get clean
      - name: Create split archive (2000MB volumes)
        run: bash scripts/package_dist_archive.sh create "$RUNNER_TEMP/dist-linux64" "$RUNNER_TEMP/${{ env.ARCHIVE_NAME }}"
      - name: Verify archive layout and split volumes
        run: bash scripts/package_dist_archive.sh verify "$RUNNER_TEMP/${{ env.ARCHIVE_NAME }}"

  package-win64-smoke:
    name: Package smoke (Windows)
    if: ${{ github.event_name != 'workflow_call' || inputs.run_packaging_checks }}
    needs: [rust-tests, web-build-check]
    runs-on: windows-latest
    env:
      ARCHIVE_NAME: videnoa-win64-smoke.7z
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '33.5'
          repo-token: ${{ github.token }}
      - name: Install dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
            throw 'protoc not found after setup-protoc step'
          }

          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            throw 'Failed to provision 7z (required for archive operations)'
          }

          if (-not (Get-Command aria2c -ErrorAction SilentlyContinue)) {
            choco install aria2 -y --no-progress
          }
          if (-not (Get-Command aria2c -ErrorAction SilentlyContinue)) {
            Write-Warning 'aria2 not available; package_dist.ps1 will fallback to curl/Invoke-WebRequest'
          }
      - name: Build package bundle
        shell: pwsh
        run: |
          pwsh -File scripts/package_dist.ps1 -Platform win64 -ReleaseTag misc -OutputDir "$env:RUNNER_TEMP\dist-win64" -SourceDir "$env:GITHUB_WORKSPACE" -Force
      - name: Create split archive (2000MB volumes)
        shell: pwsh
        run: |
          $distRoot = Join-Path $env:RUNNER_TEMP 'dist-win64'
          $bundleDir = Join-Path $distRoot 'videnoa'
          $archivePath = Join-Path $env:RUNNER_TEMP $env:ARCHIVE_NAME
          if (-not (Test-Path $bundleDir -PathType Container)) {
            throw "Expected bundle directory not found: $bundleDir"
          }
          Get-ChildItem -Path "$archivePath*" -ErrorAction SilentlyContinue | Remove-Item -Force
          Push-Location $distRoot
          try {
            7z a -t7z -v2000m $archivePath 'videnoa'
          }
          finally {
            Pop-Location
          }
      - name: Verify archive layout and split volumes
        shell: pwsh
        run: |
          $archiveBase = Join-Path $env:RUNNER_TEMP $env:ARCHIVE_NAME
          $firstVolume = "$archiveBase.001"
          if (-not (Test-Path $firstVolume -PathType Leaf)) {
            if (Test-Path $archiveBase -PathType Leaf) {
              $firstVolume = $archiveBase
            }
            else {
              throw "Missing split archive output: $archiveBase(.001)"
            }
          }
          $listing = 7z l $firstVolume
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect archive listing for $firstVolume"
          }
          if (-not ($listing -match 'videnoa[/\\]')) {
            throw "Archive root layout validation failed: missing videnoa/ root"
          }

  docker-build-smoke:
    name: Docker build smoke
    if: ${{ github.event_name != 'workflow_call' || inputs.run_packaging_checks }}
    needs: [rust-tests, web-build-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t videnoa-ci-smoke .
      - name: Run Docker CLI smoke
        run: docker run --rm videnoa-ci-smoke videnoa --help >/dev/null
