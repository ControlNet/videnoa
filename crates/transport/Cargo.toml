[package]
name = "videnoa-transport"
version.workspace = true
rust-version.workspace = true
edition = "2021"

[dependencies]
anyhow.workspace = true
iroh = "=1.1.0"
iroh-proxy-utils = "=0.3.0"
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
http = "1"
tempfile = "3"
tracing.workspace = true

[dev-dependencies]
# Local relay servers for tests; never part of production builds.
iroh = { version = "=1.1.0", features = ["test-utils"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "forbid"
