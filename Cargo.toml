[workspace]
members = ["crates/core", "crates/app", "crates/desktop", "crates/controller"]
resolver = "2"

[workspace.package]
version = "0.1.2"
rust-version = "1.83"

[workspace.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "cuda", "tensorrt", "ndarray", "load-dynamic", "half", "api-23"] }
half = "2"
ndarray = "0.17"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
petgraph = { version = "0.8", features = ["serde-1"] }
anyhow = "1"
argon2 = "0.5.3"
base64 = "0.22.1"
cap-fs-ext = "=3.4.2"
cap-std = "=3.4.2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = { version = "0.5", features = ["util"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "blocking"] }
rustix = { version = "=0.38.44", features = ["fs"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rayon = "1"
rpassword = "=7.3.1"
url = { version = "2", features = ["serde"] }
rust-embed = "=8.11.0"
mime_guess = "2"
percent-encoding = "2"
figment = { version = "0.10", features = ["env", "toml"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6.1"
